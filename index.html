<!doctype html>
<html lang="en">
  <head>
    <!--
      **********************************************************
      *                  Crumb Widget — Dev                   *
      **********************************************************
      Local dev entry point for the embeddable BMLT meeting finder
      widget. Vite serves this page and loads the Svelte source from
      `/src/main.ts`. For the production-bundled IIFE, swap that script
      tag for the CDN build (see PRODUCTION USAGE below).

      Crumb Widget is licensed under the MIT License — see LICENSE.
    -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMLT Meeting Finder - Dev</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #f3f4f6;
        font-family: system-ui, sans-serif;
      }
      #crumb-widget {
        height: 80vh;
        max-width: 1000px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <!--
      **********************************************************
      *                  WIDGET CONTAINER                       *
      **********************************************************
      The widget mounts inside this <div>. It MUST have id="crumb-widget"
      (the IIFE entry in src/main.ts looks up that ID).

      Configuration is supplied via `data-*` attributes:

        data-server          (required)  BMLT root_server URL.
        data-service-body    (optional)  A single service body ID, or a
                                         comma-separated list ("1,2,3").
                                         Omit / empty = fetch all meetings.
                                         Overridable at runtime via ?services=.
        data-format-ids      (optional)  Numeric BMLT format IDs to lock the
                                         widget to ("4" or "4,7,12"). Server-side
                                         filter — only matching meetings fetched.
                                         Overridable at runtime via ?format_ids=.
                                         For server-agnostic filtering by code,
                                         use CrumbWidgetConfig.formats instead.
        data-view            (optional)  Default view: "list" | "map" | "both"
                                         (default: "list"). Overridable at
                                         runtime via ?view= (also accepts "auto"
                                         to prompt for geolocation on load).
        data-columns         (optional)  Comma-separated list of columns to show:
                                         "time,distance,name,location,address,
                                         service_body,formats" (e.g. "time,name,address").
                                         Overridden by CrumbWidgetConfig.columns
                                         when both set.
        data-inline-formats  (optional)  Comma-separated format key strings
                                         (e.g. "M,W") highlighted inline next to
                                         each meeting name. Opt-in: defaults to
                                         "" (none). Overridden by
                                         CrumbWidgetConfig.inlineFormats when both set.
        data-path            (optional)  Base path for History API routing
                                         (e.g. "/meetings" produces clean URLs
                                         like /meetings/monday-night-meeting-42).
                                         Use data-path="" for path routing with
                                         no prefix (e.g. iframe embeds). Omit to
                                         use hash-based routing (default).
        data-update-url      (optional)  URL template for the "Update Meeting Info"
                                         link on the meeting detail panel. Tokens:
                                         {meeting_id}, {meeting_name}, {server_url},
                                         {return_url} (URL-encoded). Works with
                                         bmlt-workflow, hosted forms, or mailto:.
        data-query           (optional)  Raw BMLT query string passed to rawQuery()
                                         verbatim (e.g. "meeting_key=location_nation
                                         &meeting_key_value[]=USA"). Use for filters
                                         the structured options can't express.
                                         Replaces the default load entirely —
                                         service-body, format-ids, and ?services are
                                         ignored. Forces geolocation off (can't
                                         safely layer lat/long/geo_width on top).
                                         page_size, get_used_formats=1, and lang_enum
                                         are appended automatically.
    -->
    <div id="crumb-widget" data-server="https://bmlt.sezf.org/main_server/" data-service-body="95,173" data-view="list" data-path="/"></div>

    <!--
      **********************************************************
      *               OPTIONAL GLOBAL CONFIG                    *
      **********************************************************
      `window.CrumbWidgetConfig` is read once at mount and overrides
      any matching `data-*` attribute. It MUST be defined BEFORE the
      widget script tag below, otherwise the values are ignored.

      All fields are optional. See src/types/index.ts (CrumbWidgetConfig)
      for the full TypeScript surface.

        language          ISO code, one of: 'en', 'es', 'fr', 'de', 'pt',
                          'it', 'sv', 'da', 'el', 'fa', 'pl', 'ru', 'ja'.
                          Defaults to navigator.language; unsupported
                          codes silently fall back.
        view              'list' | 'map' | 'both' — overrides data-view.
        columns           Array of column keys to show in the meeting list:
                          'time' | 'distance' | 'name' | 'location' | 'address'
                          | 'service_body' | 'formats'. 'service_body' and
                          'formats' hidden by default; 'formats' renders one chip
                          per format showing its localized name (e.g. "Open");
                          'distance' only renders when geolocation is active.
        geolocation       Boolean — enables Near Me + typed location search
                          (city/zip/address via Nominatim) on the search input.
                          Defaults true on the unconstrained aggregator
                          (aggregator.bmltenabled.org with no service-body),
                          false otherwise.
        geolocationRadius Number. Positive = fixed radius in distanceUnit.
                          Negative integer = BMLT auto-radius (e.g. -50 finds
                          roughly 50 nearby meetings). Defaults to -50.
        distanceOptions   Number[] — radii offered in the dropdown. Defaults
                          to [5, 10, 15, 25, 50, 100].
        distanceUnit      'mi' | 'km'. Auto-detected from the resolved locale
                          when omitted (US/UK/Liberia/Myanmar → 'mi', else 'km').
        height            Number (px) — fixed widget height.
        darkMode          'auto' | true | false — auto follows the OS.
        nowOffset         Number (minutes) — meetings starting within this
                          window count as "happening now". Defaults to 10.
        hideHeader        Boolean — suppress the widget header.
        formats           String[] — format key strings (e.g. ['O', 'BT']) to
                          lock the widget to. Client-side filter after fetch.
                          Overridable at runtime via ?formats=.
        inlineFormats     String[] — format key strings (e.g. ['M', 'W']) to
                          highlight inline next to each meeting name in the
                          list/cards. Renders the matching format's localized
                          name (e.g. "Women") as a muted suffix. Opt-in:
                          defaults to [] (none). Codes vary by server.
                          Equivalent to the data-inline-formats attribute.
        basePath          String — base path for History API routing (e.g.
                          '/meetings'). Equivalent to the data-path attribute.
        updateUrl         String — URL template for the "Update Meeting Info"
                          link. Equivalent to the data-update-url attribute.
        query             String — raw BMLT query passed through to rawQuery().
                          Equivalent to the data-query attribute. Replaces the
                          default load; forces geolocation off. See data-query
                          above for details.
        map.tiles         { url, attribution } — custom tile layer (light).
        map.tiles_dark    { url, attribution } — custom tile layer (dark).
        map.markers.location  Custom Leaflet marker { html, width, height }.
    -->
    <script>
      var CrumbWidgetConfig = {
        language: 'en',
        // query: 'GetSearchResults&venue_types=2&meeting_key=location_nation&meeting_key_value[]=US&meeting_key_value[]=USA',
        columns: ['time', 'name', 'location', 'address', 'service_body', 'formats']
        // inlineFormats: ['W']
        // showFormats: true
      };
    </script>

    <!--
      **********************************************************
      *                     WIDGET SCRIPT                       *
      **********************************************************
      DEV: this loads the Svelte source via Vite's module resolver.
      PRODUCTION USAGE: replace the line below with the CDN build:

          <script type="module" src="https://cdn.aws.bmlt.app/crumb-widget.js"></script>

      Or use a self-hosted copy of `dist/app.js` (single self-contained
      IIFE — CSS is injected at runtime, no separate stylesheet required).
    -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
