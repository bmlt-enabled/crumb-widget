<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test: Formats Column — Crumb Widget</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f8fafc;
      }
      .test-bar {
        background: #1e293b;
        color: #f1f5f9;
        padding: 10px 16px;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .test-bar a {
        color: #94a3b8;
        text-decoration: none;
      }
      .test-bar a:hover {
        color: #f1f5f9;
      }
      .test-bar strong {
        color: #fff;
      }
      .test-bar code {
        background: #334155;
        padding: 2px 7px;
        border-radius: 4px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="test-bar">
      <a href="/tests/index.html">← Tests</a>
      <strong>Formats column</strong>
      <code>data-columns="time,name,location,address,formats"</code> — list view renders one chip per format, showing its localized name (e.g. <code>Open</code>, <code>Basic Text</code>).
    </div>

    <div id="crumb-widget" data-server="https://bmlt.sezf.org/main_server/" data-service-body="119" data-columns="time,name,location,address,formats"></div>

    <script src="../app.js"></script>
  </body>
</html>
